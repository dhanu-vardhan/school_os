services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: schoolos
      POSTGRES_USER: schoolos_owner
      POSTGRES_PASSWORD: schoolos_owner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolos_owner -d schoolos"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ../keycloak:/opt/keycloak/data/import
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: http://localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  # MinIO remains the documented local S3 target; it is opt-in because some CI/ARM
  # registries do not serve the image. `storage` below is the default S3 fallback.
  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8025/api/v1/messages || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  clamav:
    profiles: ["infra"]
    image: clamav/clamav:latest
    ports:
      - "3310:3310"

  storage:
    image: localstack/localstack:3
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: eu-west-3
    ports:
      - "4566:4566"
    volumes:
      - storage-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4566/_localstack/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/schoolos
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/schoolos
      SCHOOLOS_DEMO_JWT_SECRET: schoolos-local-demo-jwt-secret-change-me
      SCHOOLOS_STORAGE_ENDPOINT: http://storage:4566
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  bff:
    build:
      context: ../..
      dockerfile: services/bff/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      WEB_DIST: /app/web-dist
      API_BASE_URL: http://api:8080
      SCHOOLOS_PROFILE: demo
      SCHOOLOS_DEMO_JWT_SECRET: schoolos-local-demo-jwt-secret-change-me
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  storage-data:
